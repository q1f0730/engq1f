# 备用：用 wrangler 把 BACKEND=cloudflare 的构建 + functions/ 直接发到 Cloudflare Pages（只在手动触发时运行）。
# 推荐的方式是 Cloudflare Pages 的 Git 集成（push 到 main 由 Cloudflare 自己构建），见 docs/deploy-cloudflare.md；两者选一个。
# 需要的仓库设置（Settings → Secrets and variables → Actions）：
#   Secrets:   CLOUDFLARE_API_TOKEN（权限：Account · Cloudflare Pages · Edit + D1 · Edit）、CLOUDFLARE_ACCOUNT_ID
#   Variables: CF_PAGES_PROJECT（Pages 项目名，例如 cet4-vocab）
#   Pages 项目自己的 Secret（运行时，functions/ 读）：JWT_SECRET；可选 RESEND_API_KEY、MAIL_FROM
#   wrangler.toml 里的 database_id 要先换成真实的（wrangler d1 create 打印的）
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build (BACKEND=cloudflare)
        run: pnpm build
        env:
          BACKEND: cloudflare

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply cet4-vocab --remote

      - name: Deploy (wrangler pages deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
