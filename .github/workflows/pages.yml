# 推送到 main 时构建并发布到 GitHub Pages
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # base: "./" + hash 路由：产物可以直接放在 https://<user>.github.io/<repo>/ 子路径下
      - name: Build
        run: pnpm build
        # 13.0 · 云同步：在仓库 Settings → Secrets and variables → Actions → Variables 里设 SUPABASE_URL / SUPABASE_ANON_KEY
        # （anon key 是公开的，RLS 把关）；不设 = 纯本机版
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
